# Runs the adversarial eval against Workers AI when a change could alter how the bot answers, and posts the
# report on the PR. It never fails the PR: answers vary between runs, so a hard gate would be flaky (issue #6).
# The token is scoped to Workers AI only; it can't deploy.
name: Eval

on:
  pull_request:
    paths:
      - profile.md
      - src/worker/answer.ts
      - src/worker/prompt.ts
      - patches/**
      - evals/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/eval.yml

jobs:
  eval:
    concurrency:
      group: eval-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.6.1
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eval
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: pnpm eval

      - name: Post report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f evals/report.md ]; then echo "No report; the eval didn't run." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          cat evals/report.md >> "$GITHUB_STEP_SUMMARY"
          # Update the previous eval comment instead of adding one per push.
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- natbot-eval -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@evals/report.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file evals/report.md
          fi
